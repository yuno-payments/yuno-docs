<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 250" role="img" aria-label="Timeline: a void is possible from the approved sale until the batch closes; a refund is possible from the sale onwards, through settlement and deposit" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f6-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f6-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="f6-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8A5A00"/></marker><marker id="f6-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker><marker id="f6-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3E4FE0"/></marker></defs><rect x="0" y="0" width="910" height="250" rx="14" fill="#FFFFFF"/><line x1="40" y1="120" x2="870" y2="120" stroke="#C7CBD3" stroke-width="2"/><circle cx="60" cy="120" r="6" fill="#FFFFFF" stroke="#282A30" stroke-width="2"/><text x="60" y="150" text-anchor="start" font-size="12" font-weight="600" fill="#282A30">Sale approved</text><text x="60" y="166" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">12:21</text><circle cx="430" cy="120" r="6" fill="#FFFFFF" stroke="#282A30" stroke-width="2"/><text x="430" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Batch closes</text><text x="430" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">23:30 store time</text><circle cx="640" cy="120" r="6" fill="#FFFFFF" stroke="#282A30" stroke-width="2"/><text x="640" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Settlement file</text><text x="640" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">next business day</text><circle cx="840" cy="120" r="6" fill="#FFFFFF" stroke="#282A30" stroke-width="2"/><text x="840" y="150" text-anchor="end" font-size="12" font-weight="600" fill="#282A30">Deposit</text><text x="840" y="166" text-anchor="end" font-size="11" font-weight="400" fill="#6F7580">acquirer's terms</text><rect x="66" y="62" width="358" height="40" rx="8" fill="#DEFFF3" stroke="#1F9E70"/><text x="80" y="78" text-anchor="start" font-size="12.5" font-weight="600" fill="#0E6B4A">Void</text><text x="80" y="94" text-anchor="start" font-size="11" font-weight="400" fill="#0E6B4A">same POS terminal · no card · whole sale</text><rect x="66" y="186" width="804" height="40" rx="8" fill="#EEF0FD" stroke="#3E4FE0"/><text x="80" y="202" text-anchor="start" font-size="12.5" font-weight="600" fill="#2F3EB8">Refund</text><text x="80" y="218" text-anchor="start" font-size="11" font-weight="400" fill="#2F3EB8">any POS terminal of the store with the card, or the dashboard or API without it · all or part</text><text x="40" y="30" text-anchor="start" font-size="12" font-weight="600" fill="#282A30">Both always go to the acquirer that approved the sale.</text></svg>