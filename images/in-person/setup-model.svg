<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 340" role="img" aria-label="What is set up where: your Yuno account and acquirer contracts, the acquirer keys inside Yuno's HSM, and the store, terminal and lane." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="sm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="sm-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="sm-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="sm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker></defs><rect x="0" y="0" width="910" height="340" rx="14" fill="#FFFFFF"/><rect x="24" y="24" width="280" height="248" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="42" y="48" font-size="10.5" font-weight="700" fill="#6F7580" letter-spacing=".07em">YUNO</text><rect x="324" y="24" width="250" height="248" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="342" y="48" font-size="10.5" font-weight="700" fill="#6F7580" letter-spacing=".07em">YOUR CONTRACTS</text><rect x="600" y="24" width="286" height="248" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="618" y="48" font-size="10.5" font-weight="700" fill="#6F7580" letter-spacing=".07em">IN THE STORE</text><rect x="42" y="66" width="244" height="40" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="164.0" y="85.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno account</text><text x="164.0" y="99.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">the same one as online</text><rect x="42" y="118" width="244" height="40" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="164.0" y="137.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Routing rules</text><text x="164.0" y="151.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">per store, per sale</text><rect x="42" y="170" width="244" height="48" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.6"/><text x="164.0" y="193.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno HSM</text><text x="164.0" y="207.0" font-size="9.5" font-weight="400" fill="#4B5059" text-anchor="middle">holds every acquirer's PIN zone key</text><text x="42" y="240" font-size="10" font-weight="400" fill="#6F7580">One integration per acquirer lives here,</text><text x="42" y="254" font-size="10" font-weight="400" fill="#6F7580">not on the terminal.</text><rect x="342" y="66" width="214" height="40" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="449.0" y="85.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Acquirer A</text><text x="449.0" y="99.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">merchant ID 8012345</text><rect x="342" y="118" width="214" height="40" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="449.0" y="137.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Acquirer B</text><text x="449.0" y="151.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">merchant ID 4410987</text><text x="342" y="180" font-size="10" font-weight="400" fill="#6F7580">The contract, the merchant ID and the</text><text x="342" y="194" font-size="10" font-weight="400" fill="#6F7580">TID are yours. Each acquirer injects its</text><text x="342" y="208" font-size="10" font-weight="400" fill="#6F7580">PIN zone key into Yuno's HSM, under a</text><text x="342" y="222" font-size="10" font-weight="400" fill="#6F7580">key-exchange ceremony with Yuno.</text><text x="342" y="250" font-size="10" font-weight="600" fill="#8A5A00">Yuno is never in the money flow.</text><rect x="618" y="66" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="743.0" y="85.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Store</text><text x="743.0" y="99.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">time zone · lanes</text><rect x="618" y="118" width="250" height="48" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="743.0" y="141.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">POS terminal</text><text x="743.0" y="155.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">Yuno Payment App · one Yuno key</text><rect x="618" y="178" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="743.0" y="197.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Checkout system</text><text x="743.0" y="211.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">lane 3</text><text x="618" y="240" font-size="10" font-weight="400" fill="#6F7580">The terminal is injected once, with</text><text x="618" y="254" font-size="10" font-weight="400" fill="#6F7580">Yuno's key. It holds no acquirer key.</text><line x1="340" y1="194" x2="288" y2="194" stroke="#3E4FE0" stroke-width="1.6" marker-end="url(#sm-a)"/><text x="314" y="186" font-size="9.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">PIN zone key</text><line x1="556" y1="142" x2="616" y2="142" stroke="#6F7580" stroke-width="1.4" stroke-dasharray="4 3"/><text x="586" y="134" font-size="9.5" font-weight="600" fill="#6F7580" text-anchor="middle">TID</text><line x1="286" y1="138" x2="310" y2="138" stroke="#6F7580" stroke-width="0" /><rect x="24" y="286" width="862" height="38" rx="10" fill="#FFF4D6"/><text x="455" y="303" font-size="10.5" font-weight="600" fill="#8A5A00" text-anchor="middle">Adding an acquirer: a contract and a merchant ID from you, an integration and a key ceremony in Yuno.</text><text x="455" y="317" font-size="10.5" font-weight="400" fill="#8A5A00" text-anchor="middle">Nothing is installed on the terminals, and no terminal is recertified.</text></svg>