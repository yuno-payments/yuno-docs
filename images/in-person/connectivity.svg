<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Two different outages. Losing an acquirer keeps the store selling; losing Yuno Cloud stops card sales through Yuno." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="c1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="c1-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="c1-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="c1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker></defs><rect x="0" y="0" width="900" height="340" rx="14" fill="#FFFFFF"/><rect x="30" y="24" width="410" height="258" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="48" y="52" font-size="14" font-weight="700" fill="#282A30">An acquirer is unreachable</text><rect x="48" y="62" width="141.7" height="20" rx="10" fill="#DEFFF3"/><text x="118.845" y="76" font-size="10.5" font-weight="600" fill="#0E6B4A" text-anchor="middle" letter-spacing=".04em">STORE KEEPS SELLING</text><rect x="48" y="100" width="152" height="38" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="124.0" y="118.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">POS terminal</text><text x="124.0" y="132.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">Yuno Payment App</text><rect x="48" y="160" width="152" height="38" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="124.0" y="178.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno Cloud</text><text x="124.0" y="192.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">host · HSM · routing</text><rect x="48" y="220" width="152" height="38" rx="8" fill="#FDEEEE" stroke="#C43D3D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="124.0" y="238.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Acquirer A</text><text x="124.0" y="252.0" font-size="9.5" font-weight="400" fill="#C43D3D" text-anchor="middle">no answer</text><line x1="124" y1="138" x2="124" y2="158" stroke="#1F9E70" stroke-width="1.4" marker-end="url(#c1-ag)"/><line x1="124" y1="198" x2="124" y2="218" stroke="#C43D3D" stroke-width="1.4" marker-end="url(#c1-ar)"/><text x="222" y="112" font-size="10.5" font-weight="600" fill="#282A30">Yuno Cloud stops sending to</text><text x="222" y="128" font-size="10.5" font-weight="600" fill="#282A30">that acquirer. The next sale goes</text><text x="222" y="144" font-size="10.5" font-weight="600" fill="#282A30">to the next one in your route.</text><text x="222" y="160" font-size="10.5" font-weight="400" fill="#6F7580"></text><text x="222" y="176" font-size="10.5" font-weight="400" fill="#4B5059">A sale already on its way is</text><text x="222" y="192" font-size="10.5" font-weight="400" fill="#4B5059">reversed with the same acquirer,</text><text x="222" y="208" font-size="10.5" font-weight="400" fill="#4B5059">never sent to another.</text><text x="222" y="224" font-size="10.5" font-weight="400" fill="#6F7580"></text><text x="222" y="240" font-size="10.5" font-weight="400" fill="#6F7580">The customer sees nothing.</text><rect x="460" y="24" width="410" height="258" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="478" y="52" font-size="14" font-weight="700" fill="#282A30">Yuno Cloud is unreachable</text><rect x="478" y="62" width="180.8" height="20" rx="10" fill="#FDEEEE"/><text x="568.375" y="76" font-size="10.5" font-weight="600" fill="#C43D3D" text-anchor="middle" letter-spacing=".04em">NO CARD SALE THROUGH YUNO</text><rect x="478" y="100" width="152" height="38" rx="8" fill="#FFFFFF" stroke="#B98900" stroke-width="1.4"/><text x="554.0" y="118.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">POS terminal</text><text x="554.0" y="132.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">one key: Yuno's</text><rect x="478" y="160" width="152" height="38" rx="8" fill="#FDEEEE" stroke="#C43D3D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="554.0" y="178.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno Cloud</text><text x="554.0" y="192.0" font-size="9.5" font-weight="400" fill="#C43D3D" text-anchor="middle">no answer</text><rect x="478" y="220" width="152" height="38" rx="8" fill="#FFFFFF" stroke="#C7CBD3" stroke-width="1.2"/><text x="554.0" y="238.0" font-size="11.5" font-weight="600" fill="#6F7580" text-anchor="middle">Acquirer</text><text x="554.0" y="252.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">never reached</text><line x1="554" y1="138" x2="554" y2="158" stroke="#C43D3D" stroke-width="1.4" marker-end="url(#c1-ar)"/><line x1="554" y1="198" x2="554" y2="218" stroke="#C7CBD3" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#c1-a)"/><text x="652" y="112" font-size="10.5" font-weight="600" fill="#282A30">The terminal holds no acquirer</text><text x="652" y="128" font-size="10.5" font-weight="600" fill="#282A30">key, so it cannot authorise a</text><text x="652" y="144" font-size="10.5" font-weight="600" fill="#282A30">card sale on its own.</text><text x="652" y="160" font-size="10.5" font-weight="400" fill="#6F7580"></text><text x="652" y="176" font-size="10.5" font-weight="400" fill="#4B5059">The customer sees a clean</text><text x="652" y="192" font-size="10.5" font-weight="400" fill="#4B5059">decline and nothing is charged.</text><text x="652" y="208" font-size="10.5" font-weight="400" fill="#6F7580"></text><text x="652" y="224" font-size="10.5" font-weight="400" fill="#6F7580">The cashier takes cash or</text><text x="652" y="240" font-size="10.5" font-weight="400" fill="#6F7580">another terminal.</text><text x="450" y="306" font-size="10.5" font-weight="400" fill="#6F7580" text-anchor="middle">Yuno Cloud runs active-active in two regions, and the terminal keeps the link open so a drop is known before a sale starts.</text><text x="450" y="322" font-size="10.5" font-weight="400" fill="#6F7580" text-anchor="middle">There is no store-and-forward: a card sale through Yuno always needs the link. This is a deliberate decision, not a limitation to be lifted.</text></svg>