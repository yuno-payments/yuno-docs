<svg aria-label="Two different outages. Losing Yuno keeps the store selling; losing the acquirer does not." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" aria-label="What happens when the connection drops" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f9-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f9-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f9-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="14" fill="#FFFFFF"/><rect x="30" y="24" width="410" height="252" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="48" y="52" font-size="14" font-weight="700" fill="#282A30">Yuno Cloud unreachable</text><rect x="48" y="62" width="139.60000000000002" height="20" rx="10" fill="#DEFFF3"/><text x="117.80000000000001" y="76" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">STORE KEEPS SELLING</text><rect x="48" y="104" width="170" height="40" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="133.0" y="129.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Yuno Payment App</text><rect x="252" y="104" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="337.0" y="129.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><line x1="218" y1="124" x2="252" y2="124" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f9-ag)"/><rect x="48" y="160" width="170" height="36" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="133.0" y="183.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><line x1="133" y1="144" x2="133" y2="160" stroke="#8A5A00" stroke-width="1.5" stroke-dasharray="4 3"/><text x="142" y="157" font-size="10" fill="#8A5A00">link down</text><text x="48" y="222" font-size="11.5" fill="#4B5059">Uses the last routing rules it received.</text><text x="48" y="239" font-size="11.5" fill="#4B5059">Authorises directly with the acquirer.</text><text x="48" y="256" font-size="11.5" fill="#4B5059">Queues the sale record; reports it on reconnect.</text><rect x="460" y="24" width="410" height="252" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="478" y="52" font-size="14" font-weight="700" fill="#282A30">Acquirer or network unreachable</text><rect x="478" y="62" width="101.2" height="20" rx="10" fill="#FFF3D6"/><text x="528.6" y="76" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8A5A00" letter-spacing=".04em">CLEAN DECLINE</text><rect x="478" y="104" width="170" height="40" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="563.0" y="129.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Yuno Payment App</text><rect x="682" y="104" width="170" height="40" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="767.0" y="129.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><line x1="648" y1="124" x2="682" y2="124" stroke="#8A5A00" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f9-a)"/><rect x="478" y="160" width="170" height="36" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="563.0" y="183.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><line x1="563" y1="144" x2="563" y2="160" stroke="#1F9E70" stroke-width="1.5" stroke-dasharray="0"/><text x="572" y="157" font-size="10" fill="#0E6B4A">link up</text><text x="478" y="222" font-size="11.5" fill="#4B5059">Cannot authorise, so it declines with the reason.</text><text x="478" y="239" font-size="11.5" fill="#4B5059">Cashier retries or takes another method.</text><text x="478" y="256" font-size="11.5" fill="#4B5059">Nothing is charged.</text></svg>