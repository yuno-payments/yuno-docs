<svg aria-label="The authorisation goes from the POS terminal straight to the acquirer. Yuno Cloud publishes the rules the terminal applies, records every sale and reconciles it." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" aria-label="In-person payments architecture" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f2-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f2-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="430" rx="14" fill="#FFFFFF"/><rect x="28" y="40" width="392" height="230" rx="14" fill="#F4F6F9" stroke="#D9DEE5" stroke-dasharray="6 5"/><text x="46" y="66" text-anchor="start" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">IN THE STORE</text><rect x="50" y="100" width="130" height="66" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="115.0" y="130.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Checkout system</text><text x="115.0" y="147.0" text-anchor="middle" font-size="11.5" fill="#6F7580">starts the sale</text><rect x="232" y="88" width="166" height="96" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="315.0" y="133.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">POS terminal</text><text x="315.0" y="150.0" text-anchor="middle" font-size="11.5" fill="#0E6B4A">Yuno Payment App</text><text x="315" y="168" text-anchor="middle" font-size="10" fill="#0E6B4A">reads the card · PIN pad · acquirer link</text><line x1="180" y1="133" x2="232" y2="133" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f2-a)" marker-start="url(#f2-a)"/><text x="206" y="122" text-anchor="middle" font-size="10.5" fill="#6F7580">local</text><text x="46" y="200" text-anchor="start" font-size="11.5" fill="#4B5059">The card and the PIN never leave</text><text x="46" y="216" text-anchor="start" font-size="11.5" fill="#4B5059">the terminal. The acquirer is chosen</text><text x="46" y="232" text-anchor="start" font-size="11.5" fill="#4B5059">before the PIN is typed, because the</text><text x="46" y="248" text-anchor="start" font-size="11.5" fill="#4B5059">PIN is encrypted with its key.</text><text x="660" y="66" text-anchor="start" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">ACQUIRERS</text><rect x="660" y="84" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="755.0" y="107.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer A</text><text x="755.0" y="124.0" text-anchor="middle" font-size="11.5" fill="#6F7580">your contract</text><rect x="660" y="156" width="190" height="52" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="755.0" y="179.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer B</text><text x="755.0" y="196.0" text-anchor="middle" font-size="11.5" fill="#6F7580">your contract</text><line x1="398" y1="124" x2="658" y2="108" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f2-ag)"/><line x1="398" y1="146" x2="658" y2="180" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f2-ag)"/><text x="528" y="104" text-anchor="middle" font-size="11.5" fill="#0E6B4A">authorisation, direct</text><text x="528" y="176" text-anchor="middle" font-size="11.5" fill="#0E6B4A">one acquirer per sale</text><rect x="222" y="78" width="640" height="144" rx="16" fill="none" stroke="#1F9E70" stroke-width="1.2" stroke-dasharray="3 5" opacity=".9"/><rect x="430" y="232" width="280.40000000000003" height="20" rx="10" fill="#DEFFF3"/><text x="570.2" y="246" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">CERTIFIED CHAIN · TERMINAL, APP, ACQUIRER</text><rect x="300" y="318" width="300" height="82" rx="10" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="450.0" y="356.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><text x="450.0" y="373.0" text-anchor="middle" font-size="11.5" fill="#C7CBD3">routing rules · payments and events · reconciliation</text><text x="450" y="418" text-anchor="middle" font-size="11.5" fill="#4B5059">Outside the certified chain: changes here never restart a certification.</text><line x1="330" y1="184" x2="330" y2="318" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f2-a)" marker-start="url(#f2-a)"/><text x="300" y="292" text-anchor="end" font-size="11" fill="#4B5059">rules down</text><text x="300" y="306" text-anchor="end" font-size="11" fill="#4B5059">sales up</text><line x1="755" y1="208" x2="600" y2="330" stroke="#6F7580" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f2-a)"/><text x="722" y="282" text-anchor="middle" font-size="11" fill="#4B5059">settlement files</text><rect x="50" y="326" width="170" height="66" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="135.0" y="356.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your systems</text><text x="135.0" y="373.0" text-anchor="middle" font-size="11.5" fill="#6F7580">API · webhooks · dashboard</text><line x1="300" y1="359" x2="220" y2="359" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f2-a)"/></svg>