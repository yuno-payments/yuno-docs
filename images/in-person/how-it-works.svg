<svg aria-label="Every in-store sale is authorised through Yuno Cloud, which chooses the acquirer for that sale and translates the PIN. The terminal holds only Yuno's key." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="470" rx="14" fill="#FFFFFF"/><rect x="28" y="40" width="250" height="290" rx="14" fill="#F4F6F9" stroke="#D9DEE5" stroke-dasharray="6 5"/><text x="46" y="66" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">IN THE STORE</text><rect x="48" y="92" width="210" height="56" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="153.0" y="111.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Checkout system</text><text x="153.0" y="128.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#6F7580">sends the amount</text><rect x="48" y="186" width="210" height="84" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="153.0" y="211.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">POS terminal</text><text x="153.0" y="228.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0E6B4A">Yuno Payment App</text><text x="153.0" y="245.0" text-anchor="middle" font-size="10" font-weight="400" fill="#0E6B4A">one key: Yuno's</text><line x1="153" y1="148" x2="153" y2="184" stroke="#6F7580" stroke-width="1.6" marker-end="url(#a)"/><rect x="300" y="40" width="330" height="290" rx="14" fill="#F4F6F9" stroke="#D9DEE5" stroke-dasharray="6 5"/><text x="318" y="66" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">YUNO CLOUD</text><rect x="316" y="86" width="298" height="176" rx="14" fill="#FFF4D6" stroke="#B98900" stroke-dasharray="6 5"/><text x="334" y="112" font-size="11" font-weight="600" fill="#6B4F00" letter-spacing=".08em">PCI PIN ZONE · TWO REGIONS</text><rect x="336" y="124" width="258" height="52" rx="10" fill="#FFF4D6" stroke="#B98900" stroke-width="1.4"/><text x="465.0" y="141.5" text-anchor="middle" font-size="13" font-weight="600" fill="#6B4F00">Authorisation host</text><text x="465.0" y="158.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B4F00">chooses the acquirer for this sale</text><rect x="336" y="192" width="258" height="52" rx="10" fill="#FFF4D6" stroke="#B98900" stroke-width="1.4"/><text x="465.0" y="209.5" text-anchor="middle" font-size="13" font-weight="600" fill="#6B4F00">HSM</text><text x="465.0" y="226.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6B4F00">translates the PIN to that acquirer</text><line x1="465" y1="176" x2="465" y2="190" stroke="#B98900" stroke-width="1.6" marker-end="url(#a)"/><rect x="316" y="280" width="298" height="38" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="465.0" y="299.0" text-anchor="middle" font-size="11" font-weight="600" fill="#282A30">Payments · webhooks · reconciliation · fleet</text><rect x="652" y="40" width="220" height="290" rx="14" fill="#F4F6F9" stroke="#D9DEE5" stroke-dasharray="6 5"/><text x="670" y="66" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">ACQUIRERS</text><rect x="672" y="108" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="762.0" y="125.5" text-anchor="middle" font-size="13" font-weight="600" fill="#282A30">Acquirer A</text><text x="762.0" y="142.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">your contract</text><rect x="672" y="190" width="180" height="52" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="762.0" y="207.5" text-anchor="middle" font-size="13" font-weight="600" fill="#282A30">Acquirer B</text><text x="762.0" y="224.5" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">your contract</text><line x1="258" y1="214" x2="334" y2="150" stroke="#282A30" stroke-width="1.6" marker-end="url(#ad)"/><text x="300" y="186" text-anchor="middle" font-size="10" font-weight="400" fill="#282A30">authorise</text><text x="300" y="198" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6F7580">one sale</text><line x1="594" y1="132" x2="670" y2="130" stroke="#282A30" stroke-width="1.6" marker-end="url(#ad)"/><line x1="594" y1="150" x2="670" y2="206" stroke="#282A30" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/><text x="640" y="176" text-anchor="middle" font-size="9.5" font-weight="400" fill="#6F7580">chosen per sale</text><line x1="48" y1="352" x2="852" y2="352" stroke="#1F9E70" stroke-width="1.4"/><text x="450" y="372" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A">CERTIFIED CHAIN · TERMINAL · APP · YUNO CLOUD · ACQUIRER</text><text x="48" y="402" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">Yuno is never in the money flow. Settlement goes from the acquirer to you.</text><text x="48" y="422" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">If Yuno Cloud is unreachable there is no card sale through Yuno: the store falls back to its other tender.</text><text x="48" y="442" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">Screens, routing rules and instalment plans are configuration. Changing them never restarts a certification.</text></svg>