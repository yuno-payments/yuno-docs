<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="In-person payments architecture">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker></defs>
  <g font-size="12" fill="#282A30">
    <!-- store -->
    <rect x="0" y="0" width="720" height="300" fill="#FFFFFF"/><rect x="16" y="24" width="300" height="200" rx="12" fill="none" stroke="#D9DEE5" stroke-dasharray="5 4"/>
    <text x="30" y="44" font-size="11" font-weight="600" fill="#6F7580" letter-spacing="1">IN THE STORE</text>
    <rect x="34" y="70" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="89" y="92" text-anchor="middle" font-weight="600">Your POS</text><text x="89" y="108" text-anchor="middle" fill="#6F7580" font-size="11">starts the sale</text>
    <rect x="180" y="70" width="120" height="52" rx="8" fill="#DEFFF3" stroke="#1F9E70"/><text x="240" y="92" text-anchor="middle" font-weight="600" fill="#0E6B4A">Terminal</text><text x="240" y="108" text-anchor="middle" fill="#0E6B4A" font-size="11">Yuno payment app</text>
    <line x1="144" y1="96" x2="178" y2="96" stroke="#6F7580" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <text x="167" y="150" text-anchor="middle" fill="#6F7580" font-size="11">Card read and PIN stay on the terminal.</text>
    <text x="167" y="166" text-anchor="middle" fill="#6F7580" font-size="11">The acquirer is chosen before the PIN.</text>
    <!-- acquirers -->
    <rect x="560" y="52" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="630" y="79" text-anchor="middle" font-weight="600">Acquirer A</text>
    <rect x="560" y="112" width="140" height="44" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="630" y="139" text-anchor="middle" font-weight="600">Acquirer B</text>
    <line x1="300" y1="90" x2="558" y2="74" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="300" y1="102" x2="558" y2="134" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="430" y="62" text-anchor="middle" fill="#0E6B4A" font-size="11" font-weight="600">authorisation, direct to the acquirer</text>
    <!-- yuno cloud -->
    <rect x="340" y="200" width="220" height="76" rx="12" fill="#282A30"/><text x="450" y="226" text-anchor="middle" fill="#FFFFFF" font-weight="600">Yuno Cloud</text>
    <text x="450" y="244" text-anchor="middle" fill="#D9DEE5" font-size="11">routing rules · payments · events</text><text x="450" y="260" text-anchor="middle" fill="#D9DEE5" font-size="11">reconciliation · dashboard</text>
    <line x1="270" y1="124" x2="372" y2="198" stroke="#6F7580" stroke-width="1.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
    <text x="300" y="176" fill="#6F7580" font-size="11">rules down, sales up</text>
    <line x1="560" y1="156" x2="520" y2="198" stroke="#6F7580" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <text x="588" y="186" fill="#6F7580" font-size="11">settlement files</text>
    <!-- you -->
    <rect x="34" y="236" width="150" height="44" rx="8" fill="#FFFFFF" stroke="#D9DEE5"/><text x="109" y="255" text-anchor="middle" font-weight="600">Your systems</text><text x="109" y="270" text-anchor="middle" fill="#6F7580" font-size="11">API · webhooks · dashboard</text>
    <line x1="338" y1="248" x2="186" y2="256" stroke="#6F7580" stroke-width="1.5" marker-end="url(#ar)"/>
  </g>
</svg>