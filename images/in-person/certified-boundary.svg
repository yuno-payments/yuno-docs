<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" role="img" aria-label="What changes without recertification, what is frozen in the terminal app, and what moved to Yuno Cloud." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="cb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="cb-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="cb-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="cb-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker></defs><rect x="0" y="0" width="900" height="348" rx="14" fill="#FFFFFF"/><rect x="24" y="24" width="852" height="86" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="40" y="48" font-size="10.5" font-weight="700" fill="#0E6B4A" letter-spacing=".06em">CONFIGURABLE LAYER · CHANGES WITHOUT RECERTIFICATION</text><rect x="40" y="62" width="116" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="97.875" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Brand and colours</text><rect x="166" y="62" width="150" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="240.875" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Screen texts, languages</text><rect x="326" y="62" width="98" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="375.25" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Receipt layout</text><rect x="434" y="62" width="116" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="492.375" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Idle screen media</text><rect x="560" y="62" width="144" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="632.5" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Instalment plans shown</text><rect x="715" y="62" width="133" height="26" rx="13" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.2"/><text x="781.25" y="79" font-size="10.5" font-weight="500" fill="#0E6B4A" text-anchor="middle">Telemetry and health</text><text x="40" y="104" font-size="10" font-weight="400" fill="#6F7580">Pushed from Yuno Cloud per merchant. No new certification, no new app version in the field.</text><rect x="24" y="124" width="418" height="140" rx="12" fill="#FFFFFF" stroke="#282A30" stroke-width="1.6"/><text x="44" y="150" font-size="10.5" font-weight="700" fill="#282A30" letter-spacing=".06em">CERTIFIED CORE · ON THE TERMINAL · FROZEN</text><circle cx="50" cy="168" r="2.6" fill="#282A30"/><text x="60" y="172" font-size="10.5" font-weight="400" fill="#4B5059">read the card on the vendor's kernel</text><circle cx="50" cy="186" r="2.6" fill="#282A30"/><text x="60" y="190" font-size="10.5" font-weight="400" fill="#4B5059">take the PIN under Yuno's key, one key only</text><circle cx="50" cy="204" r="2.6" fill="#282A30"/><text x="60" y="208" font-size="10.5" font-weight="400" fill="#4B5059">send one authorisation to Yuno Cloud</text><circle cx="50" cy="222" r="2.6" fill="#282A30"/><text x="60" y="226" font-size="10.5" font-weight="400" fill="#4B5059">kernel configuration, per brand and market</text><text x="44" y="252" font-size="10" font-weight="600" fill="#8A5A00">A change here is EMV L3 and PCI again.</text><rect x="462" y="124" width="414" height="140" rx="12" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.6"/><text x="482" y="150" font-size="10.5" font-weight="700" fill="#2F3EB8" letter-spacing=".06em">IN YUNO CLOUD · OUTSIDE THE TERMINAL'S CERTIFICATION</text><circle cx="488" cy="168" r="2.6" fill="#3E4FE0"/><text x="498" y="172" font-size="10.5" font-weight="400" fill="#4B5059">one integration per acquirer, versioned on its own</text><circle cx="488" cy="186" r="2.6" fill="#3E4FE0"/><text x="498" y="190" font-size="10.5" font-weight="400" fill="#4B5059">the routing rules, per store and per sale</text><circle cx="488" cy="204" r="2.6" fill="#3E4FE0"/><text x="498" y="208" font-size="10.5" font-weight="400" fill="#4B5059">PIN translation to each acquirer's key, in the HSM</text><circle cx="488" cy="222" r="2.6" fill="#3E4FE0"/><text x="498" y="226" font-size="10.5" font-weight="400" fill="#4B5059">the payment record, webhooks and reconciliation</text><text x="482" y="252" font-size="10" font-weight="600" fill="#2F3EB8">A new acquirer is a change here only.</text><rect x="24" y="286" width="852" height="38" rx="10" fill="#FFF4D6"/><text x="450" y="310" font-size="11" font-weight="600" fill="#8A5A00" text-anchor="middle">One app version, one certification, every merchant and every acquirer. Adding an acquirer never touches the terminal.</text></svg>