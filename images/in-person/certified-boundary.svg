<svg aria-label="Screens, brand and rules change without touching the certified core. The core changes only with a new certification." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" aria-label="Certified core and configurable layer of the terminal app" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f11-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f11-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f11-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="300" rx="14" fill="#FFFFFF"/><rect x="30" y="30" width="560" height="240" rx="16" fill="#F4F6F9" stroke="#D9DEE5"/><text x="48" y="56" text-anchor="start" font-size="11" font-weight="600" fill="#4B5059" letter-spacing=".08em">CONFIGURABLE LAYER · CHANGES WITHOUT RECERTIFICATION</text><rect x="48" y="78" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="62" y="95" font-size="12" fill="#282A30">Brand and colours</text><rect x="318" y="78" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="332" y="95" font-size="12" fill="#282A30">Screen texts, languages</text><rect x="48" y="112" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="62" y="129" font-size="12" fill="#282A30">Receipt layout</text><rect x="318" y="112" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="332" y="129" font-size="12" fill="#282A30">Payment methods, instalment plans</text><rect x="48" y="146" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="62" y="163" font-size="12" fill="#282A30">Routing rules per store</text><rect x="318" y="146" width="250" height="26" rx="13" fill="#FFFFFF" stroke="#D9DEE5"/><text x="332" y="163" font-size="12" fill="#282A30">Telemetry and health</text><rect x="48" y="188" width="524" height="64" rx="12" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.4"/><text x="64" y="212" font-size="12.5" font-weight="700" fill="#8A5A00">CERTIFIED CORE · frozen after certification</text><text x="64" y="234" font-size="12" fill="#8A5A00">read the card · PIN on the secure keypad · message to the acquirer · kernel configuration</text><rect x="630" y="60" width="240" height="58" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="750.0" y="86.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Acquirer integration A</text><text x="750.0" y="103.0" text-anchor="middle" font-size="11.5" fill="#0E6B4A">versioned on its own</text><rect x="630" y="136" width="240" height="58" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="750.0" y="162.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Acquirer integration B</text><text x="750.0" y="179.0" text-anchor="middle" font-size="11.5" fill="#0E6B4A">versioned on its own</text><line x1="630" y1="89" x2="574" y2="205" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f11-ag)"/><line x1="630" y1="165" x2="574" y2="220" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f11-ag)"/><text x="750" y="228" text-anchor="middle" font-size="11" fill="#4B5059">Runs inside the core. A change here</text><text x="750" y="244" text-anchor="middle" font-size="11" fill="#4B5059">is a new certification for that acquirer.</text></svg>