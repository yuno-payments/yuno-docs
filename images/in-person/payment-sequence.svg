<svg aria-label="One chip-and-PIN sale. The amber band is the moment the sale is bound to one acquirer." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" aria-label="In-person payment sequence" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f7-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f7-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f7-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="640" rx="14" fill="#FFFFFF"/><rect x="25" y="22" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="110.0" y="46.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Checkout system</text><text x="110.0" y="63.0" text-anchor="middle" font-size="11.5" fill="#6F7580">and your systems</text><rect x="245" y="22" width="170" height="54" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="330.0" y="46.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">POS terminal</text><text x="330.0" y="63.0" text-anchor="middle" font-size="11.5" fill="#0E6B4A">Yuno Payment App</text><rect x="475" y="22" width="170" height="54" rx="10" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="560.0" y="46.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><text x="560.0" y="63.0" text-anchor="middle" font-size="11.5" fill="#C7CBD3">rules · payments · reconciliation</text><rect x="705" y="22" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="790.0" y="46.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><text x="790.0" y="63.0" text-anchor="middle" font-size="11.5" fill="#6F7580">chosen for this sale</text><line x1="110" y1="76" x2="110" y2="600" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="330" y1="76" x2="330" y2="600" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="560" y1="76" x2="560" y2="600" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="790" y1="76" x2="790" y2="600" stroke="#D9DEE5" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="118" y1="110" x2="322" y2="110" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f7-a)"/><circle cx="132" cy="94" r="9" fill="#282A30"/><text x="132" y="97.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text><text x="148" y="98.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">amount, reference, store</text><line x1="552" y1="150" x2="338" y2="150" stroke="#282A30" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f7-ad)"/><circle cx="352" cy="134" r="9" fill="#282A30"/><text x="352" y="137.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text><text x="368" y="138.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">routing rules, pushed earlier</text><rect x="214.0" y="179" width="232" height="26" rx="6" fill="#DEFFF3" stroke="#1F9E70"/><circle cx="228.0" cy="192" r="9" fill="#282A30"/><text x="228.0" y="195.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3</text><text x="338" y="196.5" text-anchor="middle" font-size="12" fill="#0E6B4A" font-weight="500">acquirer chosen from the rules</text><rect x="214.0" y="219" width="232" height="26" rx="6" fill="#DEFFF3" stroke="#1F9E70"/><circle cx="228.0" cy="232" r="9" fill="#282A30"/><text x="228.0" y="235.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4</text><text x="338" y="236.5" text-anchor="middle" font-size="12" fill="#0E6B4A" font-weight="500">card read: chip or contactless</text><rect x="214.0" y="259" width="232" height="26" rx="6" fill="#DEFFF3" stroke="#1F9E70"/><circle cx="228.0" cy="272" r="9" fill="#282A30"/><text x="228.0" y="275.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">5</text><text x="338" y="276.5" text-anchor="middle" font-size="12" fill="#0E6B4A" font-weight="500">instalment plan chosen</text><rect x="40" y="298" width="820" height="40" rx="8" fill="#FFF3D6"/><circle cx="62" cy="318" r="9" fill="#8A5A00"/><text x="62" y="321.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">6</text><text x="80" y="322.5" font-size="12.5" font-weight="600" fill="#8A5A00">PIN entered on the secure keypad, encrypted with the chosen acquirer's key.</text><text x="852" y="322.5" text-anchor="end" font-size="11.5" font-weight="600" fill="#8A5A00" letter-spacing=".04em">POINT OF NO RETURN</text><line x1="338" y1="378" x2="782" y2="378" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f7-ag)"/><circle cx="352" cy="362" r="9" fill="#282A30"/><text x="352" y="365.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">7</text><text x="368" y="366.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">authorisation request, direct</text><line x1="782" y1="414" x2="338" y2="414" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f7-a)"/><circle cx="352" cy="398" r="9" fill="#282A30"/><text x="352" y="401.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">8</text><text x="368" y="402.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">approved or declined</text><line x1="322" y1="454" x2="118" y2="454" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f7-a)"/><circle cx="132" cy="438" r="9" fill="#282A30"/><text x="132" y="441.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">9</text><text x="148" y="442.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">result and receipt data</text><line x1="338" y1="494" x2="552" y2="494" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f7-ag)"/><circle cx="352" cy="478" r="9" fill="#282A30"/><text x="352" y="481.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">10</text><text x="368" y="482.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">sale record and identifiers</text><line x1="552" y1="534" x2="118" y2="534" stroke="#282A30" stroke-width="1.5" marker-end="url(#f7-ad)"/><circle cx="132" cy="518" r="9" fill="#282A30"/><text x="132" y="521.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">11</text><text x="148" y="522.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">payment created · webhook</text><line x1="782" y1="574" x2="568" y2="574" stroke="#6F7580" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f7-a)"/><circle cx="582" cy="558" r="9" fill="#282A30"/><text x="582" y="561.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">12</text><text x="598" y="562.5" text-anchor="start" font-size="11.5" fill="#282A30" font-weight="500">settlement file, later</text><text x="450" y="622" text-anchor="middle" font-size="11.5" fill="#4B5059">Yuno reconciles the settlement file per store. A timed-out authorisation is reversed with the same acquirer, never retried with another; an issuer decline is final.</text></svg>