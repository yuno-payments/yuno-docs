<svg aria-label="A chip and PIN sale: the terminal sends one authorisation to Yuno Cloud, which chooses the acquirer, translates the PIN and answers." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="650" rx="14" fill="#FFFFFF"/><text x="120" y="42" text-anchor="middle" font-size="12.5" font-weight="600" fill="#282A30">Checkout system</text><text x="120" y="58" text-anchor="middle" font-size="10" font-weight="400" fill="#6F7580">and your systems</text><line x1="120" y1="72" x2="120" y2="542" stroke="#D9DEE5" stroke-width="1.2" stroke-dasharray="4 5"/><text x="345" y="42" text-anchor="middle" font-size="12.5" font-weight="600" fill="#282A30">POS terminal</text><text x="345" y="58" text-anchor="middle" font-size="10" font-weight="400" fill="#6F7580">Yuno Payment App</text><line x1="345" y1="72" x2="345" y2="542" stroke="#D9DEE5" stroke-width="1.2" stroke-dasharray="4 5"/><text x="570" y="42" text-anchor="middle" font-size="12.5" font-weight="600" fill="#282A30">Yuno Cloud</text><text x="570" y="58" text-anchor="middle" font-size="10" font-weight="400" fill="#6F7580">host · HSM · routing</text><line x1="570" y1="72" x2="570" y2="542" stroke="#D9DEE5" stroke-width="1.2" stroke-dasharray="4 5"/><text x="800" y="42" text-anchor="middle" font-size="12.5" font-weight="600" fill="#282A30">Acquirer</text><text x="800" y="58" text-anchor="middle" font-size="10" font-weight="400" fill="#6F7580">chosen for this sale</text><line x1="800" y1="72" x2="800" y2="542" stroke="#D9DEE5" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="120" y1="102" x2="345" y2="102" stroke="#282A30" stroke-width="1.6" marker-end="url(#ad)"/><circle cx="104" cy="102" r="9" fill="#1F9E70"/><text x="104" y="105.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text><text x="232.5" y="93" text-anchor="middle" font-size="10.5" font-weight="400" fill="#282A30">amount, reference, store</text><path d="M345 142 h36 v22 h-36" fill="none" stroke="#6F7580" stroke-width="1.4" marker-end="url(#a)"/><circle cx="329" cy="142" r="9" fill="#1F9E70"/><text x="329" y="145.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text><text x="393" y="148" text-anchor="start" font-size="10.5" font-weight="400" fill="#282A30">card read: chip or contactless</text><path d="M345 185 h36 v22 h-36" fill="none" stroke="#6F7580" stroke-width="1.4" marker-end="url(#a)"/><circle cx="329" cy="185" r="9" fill="#1F9E70"/><text x="329" y="188.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3</text><text x="393" y="191" text-anchor="start" font-size="10.5" font-weight="400" fill="#282A30">instalment plan chosen</text><text x="393" y="206" text-anchor="start" font-size="10.5" font-weight="400" fill="#282A30">PIN on the secure keypad, under Yuno's key</text><line x1="345" y1="243" x2="570" y2="243" stroke="#282A30" stroke-width="1.6" marker-end="url(#ad)"/><circle cx="329" cy="243" r="9" fill="#1F9E70"/><text x="329" y="246.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4</text><text x="457.5" y="234" text-anchor="middle" font-size="10.5" font-weight="400" fill="#282A30">one authorisation: sale id, EMV data, PIN block</text><line x1="56" y1="289" x2="856" y2="289" stroke="#B98900" stroke-width="1.4" stroke-dasharray="7 5"/><text x="56" y="281" text-anchor="start" font-size="10" font-weight="600" fill="#6B4F00">POINT OF NO RETURN · from here the sale may exist at the acquirer</text><path d="M570 319 h36 v22 h-36" fill="none" stroke="#6F7580" stroke-width="1.4" marker-end="url(#a)"/><circle cx="554" cy="319" r="9" fill="#1F9E70"/><text x="554" y="322.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">5</text><text x="618" y="325" text-anchor="start" font-size="10.5" font-weight="400" fill="#282A30">acquirer chosen from your rules</text><text x="618" y="340" text-anchor="start" font-size="10.5" font-weight="400" fill="#282A30">HSM translates the PIN to its key</text><line x1="570" y1="377" x2="800" y2="377" stroke="#282A30" stroke-width="1.6" marker-end="url(#ad)"/><circle cx="554" cy="377" r="9" fill="#1F9E70"/><text x="554" y="380.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">6</text><text x="685.0" y="368" text-anchor="middle" font-size="10.5" font-weight="400" fill="#282A30">ISO 8583, in that acquirer's dialect</text><line x1="800" y1="417" x2="570" y2="417" stroke="#6F7580" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="554" cy="417" r="9" fill="#1F9E70"/><text x="554" y="420.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">7</text><text x="685.0" y="408" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">approved or declined</text><line x1="570" y1="457" x2="345" y2="457" stroke="#6F7580" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="329" cy="457" r="9" fill="#1F9E70"/><text x="329" y="460.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">8</text><text x="457.5" y="448" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">result, authorisation code, reference</text><line x1="345" y1="497" x2="120" y2="497" stroke="#6F7580" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="104" cy="497" r="9" fill="#1F9E70"/><text x="104" y="500.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">9</text><text x="232.5" y="488" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">result and receipt data</text><line x1="570" y1="541" x2="120" y2="541" stroke="#6F7580" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="345" y="532" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">payment created, channel IN_PERSON · webhook</text><line x1="800" y1="577" x2="570" y2="577" stroke="#6F7580" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="685" y="568" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">settlement file, days later</text><text x="56" y="608" text-anchor="start" font-size="10.5" font-weight="400" fill="#6F7580">One authorisation per sale. A decline is final. A timeout is reversed with the same acquirer, never sent to another.</text><text x="56" y="626" text-anchor="start" font-size="10.5" font-weight="400" fill="#6F7580">A resend to a second acquirer happens only when the first acquirer's host failed before the issuer saw the sale.</text></svg>