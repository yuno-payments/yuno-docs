" height="50" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="755.0" y="56.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Matched</text><text x="755.0" y="73.0" text-anchor="middle" font-size="11.5" fill="#0E6B4A">amount and status agree</text><line x1="560" y1="149" x2="638" y2="59" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="96" width="230" height="50" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.4"/><text x="755.0" y="118.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8A5A00">Amount conflict</text><text x="755.0" y="135.0" text-anchor="middle" font-size="11.5" fill="#8A5A00">settled for a different amount</text><line x1="560" y1="149" x2="638" y2="121" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="158" width="230" height="50" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.4"/><text x="755.0" y="180.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8A5A00">Status conflict</text><text x="755.0" y="197.0" text-anchor="middle" font-size="11.5" fill="#8A5A00">Yuno and acquirer disagree</text><line x1="560" y1="149" x2="638" y2="183" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="220" width="230" height="50" rx="10" fill="#F4F6F9" stroke="#D9DEE5" stroke-width="1.4"/><text x="755.0" y="242.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Not settled</text><text x="755.0" y="259.0" text-anchor="middle" font-size="11.5" fill="#6F7580">absent from the files so far</text><line x1="560" y1="149" x2="638" y2="245" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="224" text-anchor="middle" font-size="11.5" fill="#0E6B4A">per store · per acquirer</text><text x="450" y="274" text-anchor="middle" font-size="11.5" fill="#4B5059">Target: more than 99% of sales matched automatically.</text></svg>