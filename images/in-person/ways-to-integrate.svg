<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-label="Three ways to integrate in-person payments" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="350" rx="14" fill="#FFFFFF"/><rect x="30" y="24" width="270" height="302" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="48" y="54" font-size="14" font-weight="700" fill="#282A30">Yuno terminal app</text><rect x="48" y="64" width="158.8" height="20" rx="10" fill="#DEFFF3"/><text x="127.4" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">AVAILABLE IN THE PILOT</text><rect x="70" y="108" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="165.0" y="131.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your POS</text><line x1="165.0" y1="144" x2="165.0" y2="166" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="173.0" y="158" font-size="10.5" fill="#6F7580">local interface</text><rect x="70" y="166" width="190" height="36" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="165.0" y="189.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Terminal · Yuno app</text><line x1="165.0" y1="202" x2="165.0" y2="224" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="173.0" y="216" font-size="10.5" fill="#6F7580">authorisation</text><rect x="70" y="224" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="165.0" y="247.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><text x="48" y="298" font-size="11.5" fill="#4B5059">Your terminals run Yuno's app. Your</text><text x="48" y="314" font-size="11.5" fill="#4B5059">POS starts the sale.</text><rect x="330" y="24" width="270" height="302" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="348" y="54" font-size="14" font-weight="700" fill="#282A30">Cloud-initiated payments</text><rect x="348" y="64" width="62.800000000000004" height="20" rx="10" fill="#FFF3D6"/><text x="379.4" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8A5A00" letter-spacing=".04em">PLANNED</text><rect x="370" y="108" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="465.0" y="131.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your server</text><line x1="465.0" y1="144" x2="465.0" y2="166" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="473.0" y="158" font-size="10.5" fill="#6F7580">Payments API</text><rect x="370" y="166" width="190" height="36" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="465.0" y="189.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><line x1="465.0" y1="202" x2="465.0" y2="224" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="473.0" y="216" font-size="10.5" fill="#6F7580">wakes the terminal</text><rect x="370" y="224" width="190" height="36" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="465.0" y="247.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Terminal · Yuno app</text><text x="348" y="298" font-size="11.5" fill="#4B5059">For platforms: create the sale in the</text><text x="348" y="314" font-size="11.5" fill="#4B5059">cloud, the terminal collects it.</text><rect x="630" y="24" width="270" height="302" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="648" y="54" font-size="14" font-weight="700" fill="#282A30">Reconciliation first</text><rect x="648" y="64" width="158.8" height="20" rx="10" fill="#DEFFF3"/><text x="727.4" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">AVAILABLE IN THE PILOT</text><rect x="670" y="108" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="765.0" y="131.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your existing terminals</text><line x1="765.0" y1="144" x2="765.0" y2="166" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="773.0" y="158" font-size="10.5" fill="#6F7580">as today</text><rect x="670" y="166" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="765.0" y="189.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your acquirers</text><line x1="765.0" y1="202" x2="765.0" y2="224" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="773.0" y="216" font-size="10.5" fill="#6F7580">settlement files</text><rect x="670" y="224" width="190" height="36" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="765.0" y="247.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><text x="648" y="298" font-size="11.5" fill="#4B5059">Store-level reconciliation before any</text><text x="648" y="314" font-size="11.5" fill="#4B5059">terminal runs Yuno's app.</text></svg>