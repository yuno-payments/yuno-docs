<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Four integration types: local, cloud, standalone and reconciliation first" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f4-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f4-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="f4-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8A5A00"/></marker><marker id="f4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker><marker id="f4-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3E4FE0"/></marker></defs><rect x="0" y="0" width="900" height="330" rx="14" fill="#FFFFFF"/><rect x="24" y="24" width="202" height="282" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="40" y="54" text-anchor="start" font-size="13.5" font-weight="600" fill="#282A30">Local</text><rect x="44" y="74" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="125" y="96.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Checkout system</text><path d="M74 110 L74 136" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="82" y="127" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">store network</text><rect x="44" y="138" width="162" height="36" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="125" y="160.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0E6B4A">Yuno Payment App</text><path d="M74 174 L74 200" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="82" y="191" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">authorisation</text><rect x="44" y="202" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="125" y="224.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Acquirer</text><text x="40" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">Your checkout system</text><text x="40" y="277" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">starts the sale on the POS</text><text x="40" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">terminal, in the store.</text><rect x="242" y="24" width="202" height="282" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="258" y="54" text-anchor="start" font-size="13.5" font-weight="600" fill="#282A30">Cloud</text><rect x="262" y="74" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="343" y="96.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Your server</text><path d="M292 110 L292 136" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="300" y="127" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">Payments API</text><rect x="262" y="138" width="162" height="36" rx="10" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="343" y="160.5" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><path d="M292 174 L292 200" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="300" y="191" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">sends the sale</text><rect x="262" y="202" width="162" height="36" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="343" y="224.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0E6B4A">Yuno Payment App</text><text x="258" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">Your server creates the</text><text x="258" y="277" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">sale; the POS terminal</text><text x="258" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">collects it.</text><rect x="460" y="24" width="202" height="282" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="476" y="54" text-anchor="start" font-size="13.5" font-weight="600" fill="#282A30">Standalone</text><rect x="480" y="74" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="561" y="96.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Cashier</text><path d="M510 110 L510 136" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="518" y="127" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">keys the amount</text><rect x="480" y="138" width="162" height="36" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="561" y="160.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0E6B4A">Yuno Payment App</text><path d="M510 174 L510 200" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="518" y="191" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">authorisation</text><rect x="480" y="202" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="561" y="224.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Acquirer</text><text x="476" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">No integration: the POS</text><text x="476" y="277" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">terminal runs the whole</text><text x="476" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">sale on its own.</text><rect x="678" y="24" width="202" height="282" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="694" y="54" text-anchor="start" font-size="13.5" font-weight="600" fill="#282A30">Reconciliation first</text><rect x="698" y="74" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="779" y="96.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Current terminals</text><path d="M728 110 L728 136" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="736" y="127" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">as today</text><rect x="698" y="138" width="162" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="779" y="160.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">Your acquirers</text><path d="M728 174 L728 200" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f4-a)"/><text x="736" y="191" text-anchor="start" font-size="10" font-weight="400" fill="#6F7580">settlement files</text><rect x="698" y="202" width="162" height="36" rx="10" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="779" y="224.5" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><text x="694" y="262" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">Reconcile your current</text><text x="694" y="277" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">fleet before the terminals</text><text x="694" y="292" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">switch to Yuno.</text></svg>