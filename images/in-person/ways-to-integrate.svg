<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" role="img" aria-label="Four ways a sale reaches the POS terminal. In every one, Yuno Cloud authorises the sale." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="wt-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="wt-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="wt-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="wt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker></defs><rect x="0" y="0" width="900" height="406" rx="14" fill="#FFFFFF"/><rect x="24" y="24" width="202" height="368" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="44" y="50" font-size="13" font-weight="700" fill="#282A30">Local</text><rect x="44" y="82" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="125.0" y="102.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Checkout system</text><text x="125.0" y="116.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">store network</text><line x1="125" y1="124" x2="125" y2="144" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="44" y="144" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="125.0" y="164.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno Payment App</text><text x="125.0" y="178.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">reads the card</text><line x1="125" y1="186" x2="125" y2="206" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="44" y="206" width="162" height="42" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.4"/><text x="125.0" y="226.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno Cloud</text><text x="125.0" y="240.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">chooses, authorises</text><line x1="125" y1="248" x2="125" y2="268" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="44" y="268" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="125.0" y="293.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Acquirer</text><text x="44" y="346" font-size="10.5" font-weight="400" fill="#6F7580">Your checkout system starts</text><text x="44" y="360" font-size="10.5" font-weight="400" fill="#6F7580">the sale on the POS</text><text x="44" y="374" font-size="10.5" font-weight="400" fill="#6F7580">terminal, in the store.</text><rect x="242" y="24" width="202" height="368" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="262" y="50" font-size="13" font-weight="700" fill="#282A30">Cloud</text><rect x="262" y="82" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="343.0" y="102.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Your server</text><text x="343.0" y="116.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">Payments API</text><line x1="343" y1="124" x2="343" y2="144" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="262" y="144" width="162" height="42" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.4"/><text x="343.0" y="164.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno Cloud</text><text x="343.0" y="178.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">sends the sale</text><line x1="343" y1="186" x2="343" y2="206" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="262" y="206" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="343.0" y="226.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno Payment App</text><text x="343.0" y="240.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">reads the card</text><line x1="343" y1="248" x2="343" y2="268" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="262" y="268" width="162" height="42" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.4"/><text x="343.0" y="288.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno Cloud → acquirer</text><text x="343.0" y="302.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">authorises</text><text x="262" y="346" font-size="10.5" font-weight="400" fill="#6F7580">Your server creates the</text><text x="262" y="360" font-size="10.5" font-weight="400" fill="#6F7580">sale; the POS terminal</text><text x="262" y="374" font-size="10.5" font-weight="400" fill="#6F7580">collects it.</text><rect x="460" y="24" width="202" height="368" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="480" y="50" font-size="13" font-weight="700" fill="#282A30">Standalone</text><rect x="480" y="82" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="561.0" y="102.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Cashier</text><text x="561.0" y="116.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">keys the amount</text><line x1="561" y1="124" x2="561" y2="144" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="480" y="144" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#1F9E70" stroke-width="1.4"/><text x="561.0" y="164.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Yuno Payment App</text><text x="561.0" y="178.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">reads the card</text><line x1="561" y1="186" x2="561" y2="206" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="480" y="206" width="162" height="42" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.4"/><text x="561.0" y="226.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno Cloud</text><text x="561.0" y="240.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">chooses, authorises</text><line x1="561" y1="248" x2="561" y2="268" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="480" y="268" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="561.0" y="293.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Acquirer</text><text x="480" y="346" font-size="10.5" font-weight="400" fill="#6F7580">No integration: the POS</text><text x="480" y="360" font-size="10.5" font-weight="400" fill="#6F7580">terminal runs the whole</text><text x="480" y="374" font-size="10.5" font-weight="400" fill="#6F7580">sale on its own.</text><rect x="678" y="24" width="202" height="368" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="698" y="50" font-size="13" font-weight="700" fill="#282A30">Reconciliation first</text><rect x="698" y="82" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="779.0" y="102.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Current terminals</text><text x="779.0" y="116.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">as today</text><line x1="779" y1="124" x2="779" y2="144" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="698" y="144" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="779.0" y="164.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Your acquirers</text><text x="779.0" y="178.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">settlement files</text><line x1="779" y1="186" x2="779" y2="206" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="698" y="206" width="162" height="42" rx="8" fill="#EEF0FD" stroke="#3E4FE0" stroke-width="1.4"/><text x="779.0" y="226.0" font-size="11.5" font-weight="600" fill="#2F3EB8" text-anchor="middle">Yuno Cloud</text><text x="779.0" y="240.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">matching</text><line x1="779" y1="248" x2="779" y2="268" stroke="#6F7580" stroke-width="1.4" marker-end="url(#wt-a)"/><rect x="698" y="268" width="162" height="42" rx="8" fill="#FFFFFF" stroke="#282A30" stroke-width="1.4"/><text x="779.0" y="288.0" font-size="11.5" font-weight="600" fill="#282A30" text-anchor="middle">Dashboard</text><text x="779.0" y="302.0" font-size="9.5" font-weight="400" fill="#6F7580" text-anchor="middle">one view</text><text x="698" y="346" font-size="10.5" font-weight="400" fill="#6F7580">Reconcile your current</text><text x="698" y="360" font-size="10.5" font-weight="400" fill="#6F7580">fleet before the terminals</text><text x="698" y="374" font-size="10.5" font-weight="400" fill="#6F7580">switch to Yuno.</text><rect x="24" y="378" width="852" height="0" fill="none"/></svg>