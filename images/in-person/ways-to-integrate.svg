x="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="125.0" y="234.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><text x="40" y="272" font-size="11" fill="#4B5059">No POS integration. The</text><text x="40" y="287" font-size="11" fill="#4B5059">terminal runs the whole sale</text><text x="40" y="302" font-size="11" fill="#4B5059">on its own.</text><rect x="244" y="22" width="202" height="296" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="260" y="50" font-size="14" font-weight="700" fill="#282A30">Local</text><rect x="260" y="60" width="50.0" height="20" rx="10" fill="#DEFFF3"/><text x="285.0" y="74" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">PILOT</text><rect x="266" y="100" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="345.0" y="122.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your POS</text><line x1="345.0" y1="134" x2="345.0" y2="156" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="352.0" y="149" font-size="10" fill="#6F7580">store network</text><rect x="266" y="156" width="158" height="34" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="345.0" y="178.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Terminal · Yuno app</text><line x1="345.0" y1="190" x2="345.0" y2="212" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="352.0" y="205" font-size="10" fill="#6F7580">authorisation</text><rect x="266" y="212" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="345.0" y="234.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Acquirer</text><text x="260" y="272" font-size="11" fill="#4B5059">Your POS starts the sale over</text><text x="260" y="287" font-size="11" fill="#4B5059">the terminal's local</text><text x="260" y="302" font-size="11" fill="#4B5059">interface.</text><rect x="464" y="22" width="202" height="296" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="480" y="50" font-size="14" font-weight="700" fill="#282A30">Cloud</text><rect x="480" y="60" width="62.800000000000004" height="20" rx="10" fill="#FFF3D6"/><text x="511.4" y="74" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8A5A00" letter-spacing=".04em">PLANNED</text><rect x="486" y="100" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="565.0" y="122.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your server</text><line x1="565.0" y1="134" x2="565.0" y2="156" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="572.0" y="149" font-size="10" fill="#6F7580">Payments API</text><rect x="486" y="156" width="158" height="34" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="565.0" y="178.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><line x1="565.0" y1="190" x2="565.0" y2="212" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="572.0" y="205" font-size="10" fill="#6F7580">wakes the terminal</text><rect x="486" y="212" width="158" height="34" rx="8" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="565.0" y="234.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">Terminal · Yuno app</text><text x="480" y="272" font-size="11" fill="#4B5059">Create the sale from your</text><text x="480" y="287" font-size="11" fill="#4B5059">server; the terminal collects</text><text x="480" y="302" font-size="11" fill="#4B5059">it.</text><rect x="684" y="22" width="202" height="296" rx="14" fill="#F4F6F9" stroke="#D9DEE5"/><text x="700" y="50" font-size="14" font-weight="700" fill="#282A30">Reconciliation first</text><rect x="700" y="60" width="50.0" height="20" rx="10" fill="#DEFFF3"/><text x="725.0" y="74" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A" letter-spacing=".04em">PILOT</text><rect x="706" y="100" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="785.0" y="122.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Existing terminals</text><line x1="785.0" y1="134" x2="785.0" y2="156" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="792.0" y="149" font-size="10" fill="#6F7580">as today</text><rect x="706" y="156" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="785.0" y="178.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your acquirers</text><line x1="785.0" y1="190" x2="785.0" y2="212" stroke="#6F7580" stroke-width="1.5" marker-end="url(#a)"/><text x="792.0" y="205" font-size="10" fill="#6F7580">settlement files</text><rect x="706" y="212" width="158" height="34" rx="8" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="785.0" y="234.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Yuno Cloud</text><text x="700" y="272" font-size="11" fill="#4B5059">Reconcile your current fleet</text><text x="700" y="287" font-size="11" fill="#4B5059">before any terminal runs</text><text x="700" y="302" font-size="11" fill="#4B5059">Yuno's app.</text></svg>