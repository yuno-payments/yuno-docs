<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" role="img" aria-label="Four packages. See is the base, Orchestrate adds the app on your terminals, Unify adds one customer across channels. Connect needs no Yuno app on the device." font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="pk-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="pk-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="pk-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="pk-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker></defs><rect x="0" y="0" width="900" height="384" rx="14" fill="#FFFFFF"/><text x="40" y="52" font-size="10.5" font-weight="700" fill="#6F7580" letter-spacing=".07em">ON YOUR OWN TERMINALS</text><text x="584" y="52" font-size="10.5" font-weight="700" fill="#6F7580" letter-spacing=".07em">WITHOUT A YUNO APP ON THE DEVICE</text><rect x="40" y="70" width="520" height="262" rx="14" fill="#F7F9FF" stroke="#3E4FE0" stroke-width="1.6"/><text x="56" y="92" font-size="12" font-weight="700" fill="#2F3EB8" letter-spacing=".06em">UNIFY</text><text x="56" y="110" font-size="10" font-weight="400" fill="#4B5059">One customer and one vault across store and online, refunds either way, one instalment catalogue.</text><rect x="56" y="124" width="488" height="192" rx="12" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.6"/><text x="72" y="146" font-size="12" font-weight="700" fill="#0E6B4A" letter-spacing=".06em">ORCHESTRATE</text><text x="72" y="164" font-size="10" font-weight="400" fill="#4B5059">The Yuno Payment App on your terminals, the acquirer chosen per sale, one fleet to run.</text><rect x="72" y="178" width="456" height="122" rx="10" fill="#FFFFFF" stroke="#282A30" stroke-width="1.6"/><text x="88" y="200" font-size="12" font-weight="700" fill="#282A30" letter-spacing=".06em">SEE</text><circle cx="92" cy="218" r="2.6" fill="#282A30"/><text x="102" y="222" font-size="10.5" fill="#4B5059">Every acquirer's settlement files matched per store and channel</text><circle cx="92" cy="238" r="2.6" fill="#282A30"/><text x="102" y="242" font-size="10.5" fill="#4B5059">Approval, declines and timeouts by acquirer, store and channel</text><circle cx="92" cy="258" r="2.6" fill="#282A30"/><text x="102" y="262" font-size="10.5" fill="#4B5059">No app on the terminals, no certification, nothing to install</text><rect x="584" y="70" width="292" height="262" rx="14" fill="#FFF4D6" stroke="#B98900" stroke-width="1.6"/><text x="602" y="92" font-size="12" font-weight="700" fill="#8A5A00" letter-spacing=".06em">CONNECT</text><text x="602" y="110" font-size="10" font-weight="400" fill="#4B5059">For platforms and marketplaces.</text><text x="602" y="136" font-size="10.5" fill="#4B5059">Your server starts the sale and Yuno</text><text x="602" y="153" font-size="10.5" fill="#4B5059">wakes the right terminal</text><text x="602" y="187" font-size="10.5" fill="#4B5059">Or your own app on your own hardware</text><text x="602" y="204" font-size="10.5" fill="#4B5059">routes through Yuno, with no Yuno</text><text x="602" y="221" font-size="10.5" fill="#4B5059">app on the device</text><text x="602" y="255" font-size="10.5" fill="#4B5059">Includes See and the vault</text><circle cx="596" cy="132" r="2.6" fill="#B98900"/><circle cx="596" cy="183" r="2.6" fill="#B98900"/><circle cx="596" cy="251" r="2.6" fill="#B98900"/><text x="450" y="360" font-size="10.5" font-weight="400" fill="#6F7580" text-anchor="middle">Each package contains the one inside it. A merchant can start at See without changing a single terminal, and add the others later.</text></svg>