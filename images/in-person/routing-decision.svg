<svg aria-label="How Yuno Cloud chooses the acquirer for a sale: the first matching rule gives an ordered route and the first acquirer that passes the checks takes the sale." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker></defs><rect x="0" y="0" width="900" height="430" rx="14" fill="#FFFFFF"/><rect x="28" y="40" width="844" height="300" rx="14" fill="#F4F6F9" stroke="#D9DEE5" stroke-dasharray="6 5"/><text x="46" y="66" font-size="11" font-weight="600" fill="#6F7580" letter-spacing=".08em">IN YUNO CLOUD · AFTER THE CARD IS READ, BEFORE THE SALE IS SENT</text><rect x="52" y="120" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="127.0" y="140.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Sale</text><text x="127.0" y="157.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">store · amount</text><text x="127.0" y="174.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">card range · plan</text><line x1="202" y1="157" x2="246" y2="157" stroke="#6F7580" stroke-width="1.6" marker-end="url(#a)"/><rect x="246" y="120" width="150" height="74" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="321.0" y="140.0" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Your rules</text><text x="321.0" y="157.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">version 8</text><text x="321.0" y="174.0" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">first match wins</text><line x1="396" y1="157" x2="440" y2="157" stroke="#6F7580" stroke-width="1.6" marker-end="url(#a)"/><rect x="440" y="104" width="180" height="106" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="530.0" y="140.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#282A30">ROUTE, IN ORDER</text><text x="530.0" y="157.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6F7580">1  Acquirer A</text><text x="530.0" y="174.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6F7580">2  Acquirer B</text><rect x="664" y="96" width="184" height="122" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="756.0" y="123.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0E6B4A">EACH MUST</text><text x="756.0" y="140.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#0E6B4A">be configured for the store</text><text x="756.0" y="157.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#0E6B4A">be healthy right now</text><text x="756.0" y="174.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#0E6B4A">accept the brand</text><text x="756.0" y="191.0" text-anchor="middle" font-size="10.5" font-weight="400" fill="#0E6B4A">offer the instalment plan</text><line x1="620" y1="157" x2="662" y2="157" stroke="#1F9E70" stroke-width="1.6" marker-end="url(#ag)"/><rect x="440" y="250" width="180" height="56" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="530.0" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0E6B4A">First that passes</text><text x="530.0" y="286.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0E6B4A">takes the sale</text><line x1="530" y1="210" x2="530" y2="248" stroke="#1F9E70" stroke-width="1.6" marker-end="url(#ag)"/><rect x="664" y="250" width="184" height="56" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="756.0" y="269.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#282A30">None passes</text><text x="756.0" y="286.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">the sale is declined</text><line x1="620" y1="278" x2="662" y2="278" stroke="#6F7580" stroke-width="1.6" marker-end="url(#a)"/><text x="46" y="376" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">The choice is made in Yuno Cloud, not on the terminal. The terminal holds no acquirer key and never talks to an acquirer.</text><text x="46" y="398" text-anchor="start" font-size="11" font-weight="400" fill="#6F7580">The PIN is encrypted under Yuno's key and translated in the HSM to the key of whichever acquirer takes the sale.</text></svg>