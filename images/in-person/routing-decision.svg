<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 906 296" role="img" aria-label="How the POS terminal picks the acquirer: the first matching rule gives an ordered route; the first acquirer that passes the checks wins; otherwise the default route; otherwise the sale fails" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="f8-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#6F7580"/></marker><marker id="f8-ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#1F9E70"/></marker><marker id="f8-ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#282A30"/></marker><marker id="f8-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#8A5A00"/></marker><marker id="f8-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#C43D3D"/></marker><marker id="f8-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3E4FE0"/></marker></defs><rect x="0" y="0" width="906" height="296" rx="14" fill="#FFFFFF"/><rect x="24" y="64" width="130" height="82" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="89" y="93.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Sale</text><text x="89" y="110.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">store · amount</text><text x="89" y="126.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">MSI plan</text><path d="M154 105 L178 105" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f8-a)"/><rect x="180" y="70" width="150" height="70" rx="10" fill="#282A30" stroke="#282A30" stroke-width="1.4"/><text x="255" y="101.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#FFFFFF">Rules · v8</text><text x="255" y="118.5" text-anchor="middle" font-size="11" font-weight="400" fill="#C7CBD3">first matching rule</text><path d="M330 105 L354 105" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f8-a)"/><rect x="356" y="40" width="160" height="130" rx="12" fill="#F4F6F9" stroke="#D9DEE5"/><text x="370" y="62" text-anchor="start" font-size="11" font-weight="600" fill="#6F7580" letter-spacing="0.08em">ROUTE, IN ORDER</text><rect x="370" y="74" width="132" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="436" y="96.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">1  Acquirer A</text><rect x="370" y="120" width="132" height="36" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="436" y="142.5" text-anchor="middle" font-size="12" font-weight="600" fill="#282A30">2  Acquirer B</text><path d="M516 105 L540 105" fill="none" stroke="#6F7580" stroke-width="1.5" marker-end="url(#f8-a)"/><rect x="542" y="40" width="196" height="130" rx="12" fill="#FFFFFF" stroke="#D9DEE5"/><text x="556" y="62" text-anchor="start" font-size="11" font-weight="600" fill="#6F7580" letter-spacing="0.08em">EACH CANDIDATE MUST</text><text x="556" y="86" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">✓  have a TID and key on it</text><text x="556" y="108" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">✓  not be DOWN (health)</text><text x="556" y="130" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">✓  accept the brand</text><text x="556" y="152" text-anchor="start" font-size="11" font-weight="400" fill="#4B5059">✓  offer the MSI plan</text><path d="M738 105 L762 105" fill="none" stroke="#1F9E70" stroke-width="1.5" marker-end="url(#f8-ag)"/><rect x="764" y="70" width="118" height="70" rx="10" fill="#DEFFF3" stroke="#1F9E70" stroke-width="1.4"/><text x="823" y="101.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0E6B4A">First that</text><text x="823" y="118.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0E6B4A">passes wins</text><path d="M640 170 L640 214" fill="none" stroke="#6F7580" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f8-a)"/><rect x="646" y="185.5" width="73.835" height="15.5" fill="#FFFFFF"/><text x="650" y="196" text-anchor="start" font-size="10.5" font-weight="400" fill="#6F7580">none passes</text><rect x="542" y="216" width="196" height="56" rx="10" fill="#FFFFFF" stroke="#D9DEE5" stroke-width="1.4"/><text x="640" y="240.5" text-anchor="middle" font-size="13.5" font-weight="600" fill="#282A30">Default route</text><text x="640" y="257.5" text-anchor="middle" font-size="11" font-weight="400" fill="#6F7580">same checks</text><path d="M738 244 L762 244" fill="none" stroke="#8A5A00" stroke-width="1.5" marker-end="url(#f8-aa)"/><rect x="734.03" y="221.5" width="31.939999999999998" height="15.5" fill="#FFFFFF"/><text x="750" y="232" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6F7580">none</text><rect x="764" y="216" width="118" height="56" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.4"/><text x="823" y="240.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8A5A00">Sale fails</text><text x="823" y="257.5" text-anchor="middle" font-size="11" font-weight="400" fill="#8A5A00">no acquirer</text><path d="M720 216 L720 192 L800 192 L800 143" fill="none" stroke="#1F9E70" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#f8-ag)"/><rect x="728.075" y="175.5" width="67.85" height="15.5" fill="#FFFFFF"/><text x="762" y="186" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1F9E70">one passes</text><rect x="24" y="216" width="490" height="56" rx="10" fill="#FFF3D6" stroke="#8A5A00" stroke-width="1.2"/><text x="40" y="240" text-anchor="start" font-size="12" font-weight="600" fill="#8A5A00">Decided before the PIN, and never changed after it:</text><text x="40" y="258" text-anchor="start" font-size="11.5" font-weight="400" fill="#8A5A00">the PIN is encrypted with the chosen acquirer's key.</text></svg>