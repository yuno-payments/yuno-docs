<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#374151"/>
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#FFFFFF" stroke="#374151" stroke-width="2"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    .box { filter: url(#soft); }
    .label { font-size: 23px; letter-spacing: 1.6px; fill: #1F2937; text-anchor: middle; dominant-baseline: middle; }
    .edge { fill: none; stroke: #374151; stroke-width: 3; }
    .edgetext { font-size: 19px; fill: #64748B; text-anchor: middle; dominant-baseline: middle; }
    .caption { font-size: 20px; fill: #475569; text-anchor: middle; }
    .caption tspan.k { font-weight: 700; fill: #1F2937; }
  </style>

  <rect x="0" y="0" width="1600" height="1010" rx="30" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1528" height="938" rx="26" fill="#F1F5F9"/>
  <g stroke="#DDE3EC" stroke-width="2" stroke-dasharray="7 9">
    <path d="M 36 240 H 1564 M 36 444 H 1564 M 36 648 H 1564 M 36 852 H 1564"/>
    <path d="M 240 36 V 974 M 500 36 V 974 M 760 36 V 974 M 1020 36 V 974 M 1280 36 V 974"/>
  </g>

  <!-- edges -->
  <path class="edge" d="M 345 430 H 683" marker-start="url(#dot)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 240 387 V 270 H 403" marker-start="url(#dot)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 625 270 H 760 V 375" marker-start="url(#dot)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 840 387 V 205" marker-start="url(#dot)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 905 430 H 1213" marker-start="url(#dot)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 745 485 V 570 H 560 V 635" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="edge" d="M 855 485 V 570 H 1040 V 635" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- edge labels -->
  <g class="edgetext">
    <rect x="404" y="398" width="232" height="26" fill="#F1F5F9"/>
    <text x="520" y="412">first payment succeeds</text>
    <rect x="248" y="238" width="152" height="26" fill="#F1F5F9"/>
    <text x="324" y="252">plan with a trial</text>
    <rect x="640" y="238" width="106" height="26" fill="#F1F5F9"/>
    <text x="693" y="252">trial ends</text>
    <rect x="852" y="284" width="82" height="26" fill="#F1F5F9"/>
    <text x="893" y="298">cancel</text>
    <rect x="960" y="398" width="212" height="26" fill="#F1F5F9"/>
    <text x="1066" y="412">last cycle or finish_at</text>
    <rect x="586" y="530" width="144" height="26" fill="#F1F5F9"/>
    <text x="658" y="544">pause / resume</text>
    <rect x="866" y="530" width="224" height="26" fill="#F1F5F9"/>
    <text x="978" y="544">charge fails / recovers</text>
  </g>

  <!-- states -->
  <g class="box">
    <rect x="695" y="107" width="210" height="86" rx="18" fill="#FFE4E9" stroke="#E11D48" stroke-width="3"/>
    <rect x="415" y="227" width="210" height="86" rx="18" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
    <rect x="135" y="387" width="210" height="86" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="695" y="387" width="210" height="86" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <rect x="1225" y="387" width="210" height="86" rx="18" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
    <rect x="455" y="635" width="210" height="86" rx="18" fill="#FFEDD5" stroke="#EA580C" stroke-width="3"/>
    <rect x="935" y="635" width="210" height="86" rx="18" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  </g>
  <g class="label">
    <text x="800" y="150">CANCELED</text>
    <text x="520" y="270">TRIALING</text>
    <text x="240" y="430">CREATED</text>
    <text x="800" y="430">ACTIVE</text>
    <text x="1330" y="430">COMPLETED</text>
    <text x="560" y="678">PAUSED</text>
    <text x="1040" y="678">PAST_DUE</text>
  </g>

  <!-- transversal error state -->
  <path d="M 190 872 H 693 M 907 872 H 1410" stroke="#1F2937" stroke-width="3" stroke-dasharray="14 12"/>
  <path d="M 190 852 V 892 M 1410 852 V 892" stroke="#1F2937" stroke-width="4"/>
  <g class="box">
    <rect x="705" y="832" width="190" height="80" rx="18" fill="#FFFFFF" stroke="#E11D48" stroke-width="3"/>
  </g>
  <text class="label" x="800" y="872" font-weight="700">ERROR</text>
  <text class="caption" x="800" y="952"><tspan class="k">STATE:</tspan> Error transversal to the whole flow</text>
</svg>
