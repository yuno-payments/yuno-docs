name: Postman collection check

# The Postman collection at /files/postman/Yuno_API.postman_collection.json is
# generated from docs.json, the reference pages and openapi.json. This check
# fails when one of those changes and the collection was not regenerated, so
# the collection can never drift from the API reference.
# Fix: node scripts/build-postman-collection.cjs

on:
  pull_request:
    paths:
      - "openapi.json"
      - "openapi/**"
      - "reference/**"
      - "docs.json"
      - "files/postman/**"
      - "scripts/build-postman-collection.cjs"
      - ".github/workflows/postman-collection-check.yml"
  push:
    branches: [main]

jobs:
  check-postman-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify the collection matches the API reference
        run: node scripts/build-postman-collection.cjs --check
