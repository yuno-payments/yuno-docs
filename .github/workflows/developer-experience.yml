name: Developer experience checks

on:
  pull_request:
    paths:
      - 'index.mdx'
      - 'docs/get-started/**'
      - 'docs.json'
      - 'snippets/homepage/SessionExample.jsx'
      - 'openapi/checkout-sessions/create-checkout-session.json'
      - 'scripts/check-developer-experience.cjs'
      - '.github/workflows/developer-experience.yml'

jobs:
  check-entry-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-developer-experience.cjs
      - run: node scripts/check-descriptions.cjs
