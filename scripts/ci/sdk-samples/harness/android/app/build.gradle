plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// The SDK version comes from the docs page (extract.cjs writes it to
// versions.env, run-android.sh passes it as -PyunoAndroidSdkVersion).
def yunoAndroidSdkVersion = providers.gradleProperty('yunoAndroidSdkVersion').get()

android {
    namespace 'com.example.qs'
    compileSdk 36
    defaultConfig { applicationId 'com.example.qs'; minSdk 23; targetSdk 36 }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation "com.yuno.payments:android-sdk:${yunoAndroidSdkVersion}"
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
}
